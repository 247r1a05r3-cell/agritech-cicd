name: AgriTech CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          echo "Listing files..."
          ls -la
          echo "--- Searching html files ---"
          find. -name "*.html" -o -name "*.css" -o -name "*.js" | head -n 20

          # Check for main file - don't fail hard, just warn
          if [! -f index.html ]; then
            echo "WARNING: index.html not in root, looking in subfolders..."
            FOUND=$(find. -name "index.html" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "ERROR: index.html not found anywhere!"
              exit 1
            else
              echo "Found at: $FOUND"
            fi
          else
            echo "All files are present!"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path:.

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
